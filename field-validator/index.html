<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Field Validator</title>
</head>
<body>
    <main>
        <h1>Field Validator</h1>
        <form action="" method="post">
            <input type="email" placeholder="Insert the value here">
            <select name="field">
                <option value="email">e-mail</option>
                <option value="cpf">CPF</option>
                <option value="hexColor">Cor Hexadecimal</option>
                <option value="uuid">UUID v4</option>
                <option value="url">url</option>
            </select>
            <button>Validate</button>
        </form>
        <h4>Type the value, choice the option and click in Validate</h4>
    </main>
</body>
<script src="src/main.js" type="module" ></script>
</html>
